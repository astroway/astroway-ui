name: release

# Trusted Publishing via npm OIDC: no long-lived NPM_TOKEN secret.
# npm verifies cryptographically that the publish request comes from this
# exact workflow in this exact repository, and ships SLSA provenance.
#
# One-time setup on the npm side (https://www.npmjs.com/package/@astroway/ui/access):
#   Trusted Publishers -> Add -> Provider: GitHub Actions
#     Repository:        astroway/astroway-ui
#     Workflow filename: release.yml
#     Environment:       (leave empty)

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write       # required for npm OIDC + SLSA provenance
  attestations: write   # required for actions/attest-build-provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/**/*
      - name: Publish to npm (OIDC trusted publishing)
        # A prerelease goes out under `next` once a stable version holds `latest`; before that it is `latest` too,
        # or `npm i @astroway/ui` keeps installing the previous alpha.
        run: |
          VERSION=$(node -p "require('./package.json').version")
          LATEST=$(npm view @astroway/ui dist-tags.latest 2>/dev/null || true)
          TAG=latest
          case "$VERSION" in *-*) case "$LATEST" in ''|*-*) ;; *) TAG=next ;; esac ;; esac
          echo "publishing $VERSION under $TAG (current latest: ${LATEST:-none})"
          npm publish --provenance --access public --tag "$TAG"
        # NB: no NODE_AUTH_TOKEN: npm verifies OIDC token from id-token: write
        # permission against the configured Trusted Publisher on npm side.
